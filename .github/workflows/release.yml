name: release

# Manual trigger only (Actions tab / `gh workflow run`). Auto-on-tag is
# intentionally disabled — releases are cut by hand.
#
# Run it on a tag ref (`--ref v1.5.0`) to build that tag, or on any branch with
# `-f tag=v1.5.0` to build the branch head into the v1.5.0 release (useful when a
# workflow fix landed after the tag). The `tag` input wins when both are given.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish into (default: the ref this runs on, if it is a tag)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - os: windows-latest
            rust-target: aarch64-pc-windows-msvc
            args: "--target aarch64-pc-windows-msvc"
          - os: macos-14
            rust-target: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            args: ""
          - os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.os }}
    # macOS bundling still needs work — let it fail without blocking the release
    # or the checksums job.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    env:
      RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - name: Guard — need a tag target
        run: |
          if [ -z "${RELEASE_TAG}" ] || { [ "${{ github.ref_type }}" != "tag" ] && [ -z "${{ inputs.tag }}" ]; }; then
            echo "::error::Run this on a tag ref, or pass -f tag=vX.Y.Z"; exit 1
          fi
          echo "Building into release: ${RELEASE_TAG}"
        shell: bash

      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential file xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "MDmeow ${{ env.RELEASE_TAG }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    # Run as long as the build job didn't hard-fail (macOS is continue-on-error).
    if: ${{ always() && needs.build.result != 'failure' && (github.ref_type == 'tag' || inputs.tag != '') }}
    env:
      RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      # `gh release download` works on draft releases (robinraju's tag API does
      # not). Re-hash from scratch so a re-run stays clean.
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist && cd dist
          gh release download "${RELEASE_TAG}" --repo "${{ github.repository }}" --pattern '*' --clobber
          rm -f SHA256SUMS.txt
          sha256sum * | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: dist/SHA256SUMS.txt
