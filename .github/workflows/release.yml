name: release

# Full-platform release automation.
#
# Normal path: push an annotated vX.Y.Z tag. GitHub Actions builds signed
# Windows portable/MSI artifacts, Linux x64/ARM64 packages, and a universal
# macOS DMG, verifies the exact artifact set, generates SHA256SUMS.txt, and
# publishes one GitHub Release.
#
# Required repository secret:
#   TAURI_SIGNING_PRIVATE_KEY
# Optional when the updater key is password-protected:
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild (for example v1.8.0)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard tag and version
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like vX.Y.Z"
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag/version mismatch: tag=$RELEASE_TAG package=v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Require updater signing secret
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Repository secret TAURI_SIGNING_PRIVATE_KEY is required for Windows release signing."
          }

      - name: Build signed Windows release
        shell: pwsh
        run: pnpm release:windows

      - name: Verify Windows artifact contract
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $expected = @(
            "MDmeow-$env:VERSION.exe",
            "MDmeow-$env:VERSION.exe.sig",
            "MDmeow_$($env:VERSION)_x64.msi",
            "MDmeow_$($env:VERSION)_x64.msi.sig",
            "latest.json"
          ) | Sort-Object
          $actual = @(Get-ChildItem release -File | ForEach-Object Name | Sort-Object)
          $diff = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($diff) {
            $diff | Format-Table | Out-String | Write-Host
            throw "Unexpected Windows release artifact set."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: release/*
          if-no-files-found: error

  build-linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            build-essential \
            file \
            xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build Linux release
        run: pnpm release:linux

      - name: Verify Linux artifact contract
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          expected=(
            "MDmeow-$VERSION-linux-$ARCH.AppImage"
            "MDmeow-$VERSION-linux-$ARCH.deb"
            "MDmeow-$VERSION-linux-$ARCH.rpm"
          )
          mapfile -t actual < <(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${actual[*]}" == "${wanted[*]}" ]] || {
            echo "::error::Unexpected Linux release files: ${actual[*]}"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  build-macos:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build universal macOS release
        run: pnpm release:macos

      - name: Verify macOS artifact contract
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          expected="MDmeow-$VERSION-macOS-universal.dmg"
          count="$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          actual="$(find release -maxdepth 1 -type f -exec basename {} \;)"
          [[ "$count" -eq 1 && "$actual" == "$expected" ]] || {
            echo "::error::Unexpected macOS release files: $actual"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: release/*
          if-no-files-found: error

  publish:
    needs: [prepare, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts

      - name: Normalize downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -e "dist/$name" ]]; then
              echo "::error::Duplicate release artifact name: $name"
              exit 1
            fi
            cp "$file" "dist/$name"
          done < <(find artifacts -type f -print0)
          echo "Normalized artifacts:"
          find dist -maxdepth 1 -type f -printf '  %f\n' | sort

      - name: Verify complete cross-platform release set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "MDmeow-$VERSION.exe"
            "MDmeow-$VERSION.exe.sig"
            "MDmeow_${VERSION}_x64.msi"
            "MDmeow_${VERSION}_x64.msi.sig"
            "latest.json"
            "MDmeow-$VERSION-linux-x86_64.AppImage"
            "MDmeow-$VERSION-linux-x86_64.deb"
            "MDmeow-$VERSION-linux-x86_64.rpm"
            "MDmeow-$VERSION-linux-aarch64.AppImage"
            "MDmeow-$VERSION-linux-aarch64.deb"
            "MDmeow-$VERSION-linux-aarch64.rpm"
            "MDmeow-$VERSION-macOS-universal.dmg"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${actual[*]}" == "${wanted[*]}" ]] || {
            echo "::error::Release artifact set mismatch"
            printf 'actual: %s\n' "${actual[@]}"
            exit 1
          }

      - name: Generate SHA256 checksums
        shell: bash
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "MDmeow ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/*
