name: release

# Manual release only. The local and CI release paths deliberately share the
# same scripts/build-release.ps1 entrypoint so the published artifact contract
# cannot drift.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish into (for example v1.7.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Guard release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like vX.Y.Z."
          }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($package.version)"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag/version mismatch: tag=$env:RELEASE_TAG package=$expected"
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build final Windows release
        run: pnpm release:windows

      - name: Verify exact artifact set
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.version
          $expected = @(
            "MDmeow-$version.exe",
            "MDmeow_$($version)_x64.msi"
          )
          $actual = @(Get-ChildItem release -File | Sort-Object Name | Select-Object -ExpandProperty Name)
          if ($actual.Count -ne 2 -or (Compare-Object $expected $actual)) {
            throw "release/ must contain exactly: $($expected -join ', ')"
          }

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "MDmeow ${{ env.RELEASE_TAG }}"
          draft: true
          prerelease: false
          files: |
            release/MDmeow-*.exe
            release/MDmeow_*_x64.msi
